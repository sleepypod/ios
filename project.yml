name: Sleepypod
options:
  bundleIdPrefix: com.jonathanng.com.ios.sleepypod
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "26"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_CFBundleDisplayName: sleepypod
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_STRICT_CONCURRENCY: complete
    # Color assets named green/red/indigo would clash with the built-in Color symbols.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  Sleepypod:
    type: application
    platform: iOS
    sources:
      - path: Sleepypod
      - path: Shared
    dependencies:
      - target: SleepypodWatch
    entitlements:
      path: Sleepypod/Sleepypod.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanng.com.ios.sleepypod
        INFOPLIST_FILE: Sleepypod/Info.plist
        INFOPLIST_KEY_NSHealthShareUsageDescription: "sleepypod reads sleep samples to infer bedtimes, and Apple Watch sleep, heart rate, HRV and respiratory rate to compare them with the pod on this iPhone; nothing is uploaded."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "sleepypod connects to your sleep pod on the local network to control temperature, view sensor data, and track sleep."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZUR2343J7S
        PRODUCT_NAME: Sleepypod

  SleepypodWatch:
    type: application
    platform: watchOS
    sources:
      - path: SleepypodWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanng.com.ios.sleepypod.watchkitapp
        PRODUCT_NAME: SleepypodWatch
        INFOPLIST_KEY_CFBundleDisplayName: sleepypod
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.jonathanng.com.ios.sleepypod
        INFOPLIST_KEY_WKApplication: true
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: false
        INFOPLIST_KEY_NSMotionUsageDescription: "sleepypod records wrist movement overnight on this Watch and sends it only to your iPhone, as movement labels for training."
        TARGETED_DEVICE_FAMILY: 4
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZUR2343J7S
        SKIP_INSTALL: true

  SleepypodTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SleepypodTests
    dependencies:
      - target: Sleepypod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanng.com.ios.sleepypod.tests

  SleepypodUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SleepypodUITests
    dependencies:
      - target: Sleepypod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanng.com.ios.sleepypod.uitests
        TEST_TARGET_NAME: Sleepypod

schemes:
  Sleepypod:
    build:
      targets:
        Sleepypod: all
    test:
      targets:
        - SleepypodTests
        - SleepypodUITests
